apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-app-config
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/neerajddun/multi-tier-app.git
    targetRevision: HEAD
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: shop

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
